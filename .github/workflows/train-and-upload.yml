name: Train and publish IMDb sentiment model

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imdb-sentiment-model
  cancel-in-progress: true

jobs:
  train-and-upload:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare the IMDb dataset
        run: python data/prepare_data.py

      - name: Train and evaluate
        run: python train.py

      - name: Check inference from saved files
        run: |
          python predict.py "I loved this movie. The acting was fantastic and the story was wonderful."
          python predict.py "This movie was boring and awful. The plot made no sense."

      - name: Save model artifacts to this Actions run
        uses: actions/upload-artifact@v6
        with:
          name: imdb-sentiment-model
          if-no-files-found: error
          path: |
            model/model.pt
            model/vectorizer.pkl
            model/config.json
            model/metrics.json

      - name: Publish model and evaluation to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID }}
        run: python publish.py
